
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Task Manager</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>
    <main class="container">
        <header class="page-header">
            <h1>My Task Manager</h1>
            <p>Organize your day, one task at a time.</p>
        </header>

        <!-- Add task form -->
        <form id="task-form">
            <input
                type="text"
                id="task-input"
                placeholder="Enter a new task..."
                aria-label="New task"
                maxlength="200"
                required
            >

            <button type="submit" id="add-task-button">
                Add Task
            </button>
        </form>

        <!-- Task summary -->
        <section class="task-summary" aria-label="Task summary">
            <div class="summary-card">
                <span class="summary-label">Total</span>
                <span class="summary-number" id="total-count">0</span>
            </div>

            <div class="summary-card">
                <span class="summary-label">Pending</span>
                <span class="summary-number" id="pending-count">0</span>
            </div>

            <div class="summary-card">
                <span class="summary-label">Completed</span>
                <span class="summary-number" id="completed-count">0</span>
            </div>
        </section>

        <!-- Task list heading and filters -->
        <section class="tasks-section">
            <div class="tasks-heading">
                <h2>My Tasks</h2>
            </div>

            <div class="task-filters" aria-label="Filter tasks">
                <button
                    type="button"
                    class="filter-button active"
                    data-filter="all"
                    aria-pressed="true"
                >
                    All
                </button>

                <button
                    type="button"
                    class="filter-button"
                    data-filter="pending"
                    aria-pressed="false"
                >
                    Pending
                </button>

                <button
                    type="button"
                    class="filter-button"
                    data-filter="completed"
                    aria-pressed="false"
                >
                    Completed
                </button>
            </div>

            <ul id="task-list" aria-live="polite"></ul>

            <p id="empty-message" class="empty-message" hidden>
                No tasks here yet. Add a task to get started!
            </p>
        </section>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
